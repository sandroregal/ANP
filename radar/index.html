<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4C89">
<meta name="robots" content="noindex">
<title>Radar SP · Royal FIC</title>
<style>
:root{--navy:#0E4C89;--navy2:#1565A8;--orange:#F89D1B;--bg:#f4f6f9;--card:#fff;--line:#dde3eb;--ink:#14213a;--muted:#5d6b80;--red:#C25B3A;--green:#0E8A5C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1420;--card:#152033;--line:#26344b;--ink:#e8edf5;--muted:#93a1b6;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header img{height:30px;background:#fff;border-radius:4px;padding:2px 4px}
header h1{font-size:17px;margin:0;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button,header a{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
.tools{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.meta{font-size:12px;color:var(--muted);margin:2px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card.late{border-left-color:var(--red)}.card.soon{border-left-color:var(--orange)}.card.done{opacity:.6;border-left-color:var(--green)}.card.off{opacity:.55;border-left-style:dashed}
.top{display:flex;gap:8px;align-items:baseline}
.id{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px}
.tit{flex:1;font-weight:600;font-size:15px}
.info{font-size:13px;color:var(--muted);margin:4px 0 0 42px}
.info b{color:var(--ink);font-weight:600}
.tags{margin:6px 0 0 42px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid currentColor;border-radius:999px;padding:0 8px}
.tag.rev{color:var(--navy2)}.tag.late{color:var(--red)}.tag.soon{color:var(--orange)}
.acts{display:flex;gap:6px;margin:8px 0 0 42px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.acts button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--orange);color:#14213a;border:0;border-radius:999px;padding:14px 18px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.panel h2{margin:0 0 10px;font-size:17px;color:var(--navy)}
@media (prefers-color-scheme:dark){.panel h2{color:#9cc3ec}}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:16px;margin-top:12px}
.checks label{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--ink)}
.checks input{width:auto}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:11px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--navy)}
.primary{background:var(--navy);color:#fff}.secondary{background:transparent;color:var(--ink);border-color:var(--line)!important}
.hist{font-size:12px;color:var(--muted);white-space:pre-wrap;margin-top:6px;max-height:120px;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#14213a;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}.toast.err{background:var(--red)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.note{font-size:12px;color:var(--muted)}
</style>
</head>

      <div><label for="fPrio">Prioridade</label><select id="fPrio"><option>Alta</option><option>Média</option><option>Baixa</option><option>Rotina</option></select></div>
    </div>
    <div class="row2">
      <div><label for="fData">Prazo (data)</label><input id="fData" type="date"></div>
      <div><label for="fDia">Dia planejado (texto)</label><input id="fDia" placeholder="ex.: Até 30/10"></div>
    </div>
    <label for="fStatus">Situação</label>
    <select id="fStatus"><option>Pendente</option><option>Em andamento</option><option>Aguardando terceiros</option><option>Parado</option><option>Concluído</option><option>Recorrente</option></select>
    <label for="fProx">Próximo passo</label><textarea id="fProx"></textarea>
    <label for="fNota">Nova anotação (fica registrada com a data)</label><textarea id="fNota" placeholder="ex.: falei com o RH, retorno na quinta"></textarea>
    <div class="checks">
      <label><input type="checkbox" id="fRadar"> No radar</label>
      <label><input type="checkbox" id="fRev"> Revisar / explicar</label>
    </div>
    <div class="hist" id="fHist"></div>
    <div class="btns"><button class="secondary" id="eCancel">Cancelar</button><button class="primary" id="eSave">Salvar</button></div>
  </div>
</div>

<div class="sheet" id="sCfg" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="cTit">
    <h2 id="cTit">Conectar à planilha</h2>
    <p class="note">Cole a URL do App da Web do Apps Script (termina em /exec) e a senha (TOKEN) que você criou. Ficam salvas só neste aparelho.</p>
    <label for="cUrl">URL do App da Web</label><input id="cUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec">
    <label for="cTok">Senha (TOKEN)</label><input id="cTok" type="password" autocomplete="off">
    <div class="btns"><button class="secondary" id="cCancel">Cancelar</button><button class="primary" id="cSave">Salvar e conectar</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem('radar.' + k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem('radar.' + k, v); } catch (e) {} },
  };
  let items = [], filtro = 'radar', editing = null;

  function toast(msg, err) {
    const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = 'toast'), 2600);
  }

  async function api(method, payload) {
    const url = store.get('url'), token = store.get('token');
    if (!url || !token) { openCfg(); throw new Error('Configure a conexão'); }
    let res;
    if (method === 'GET') res = await fetch(url + '?token=' + encodeURIComponent(token) + '&t=' + Date.now());
    else res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token }, payload)) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Falha');
    return j;
  }

  // Prazo: mesma leitura do painel ("Até 30/10", "14–18/12", "Qua 28" = outubro/2026)
  function prazo(it) {
    if (/^R\d/.test(it.id) || it.prioridade === 'Rotina') return null;
    const s = it.dia || '';
    let m = s.match(/(\d{1,2})(?:\s*[–-]\s*\d{1,2})?\/(\d{1,2})/);
    if (m) { const mo = +m[2]; return new Date(mo >= 10 ? 2026 : 2027, mo - 1, +m[1]); }
    m = s.match(/\b(?:Seg|Ter|Qua|Qui|Sex)\s+(\d{1,2})\b/);
    if (m) return new Date(2026, 9, +m[1]);
    return null;
  }
  const hoje = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  const dias = (d) => d ? Math.round((d - hoje()) / 86400000) : null;
  const concl = (it) => /conclu/i.test(it.status);
  const p2 = (n) => String(n).padStart(2, '0');

  function visiveis() {
    const q = $('#q').value.trim().toLowerCase();
    return items.filter((it) => {
      if (q && !(it.id + ' ' + it.atividade + ' ' + it.frente).toLowerCase().includes(q)) return false;
      if (filtro === 'radar') return it.radar && !concl(it);
      if (filtro === 'revisar') return it.revisar;
      if (filtro === 'fora') return !it.radar;
      if (filtro === 'concluidos') return concl(it);
      return true;
    }).sort((a, b) => {
      const da = prazo(a), db = prazo(b);
      return (da ? da.getTime() : 9e15) - (db ? db.getTime() : 9e15);
    });
  }

  function render() {
    const list = $('#list'); list.replaceChildren();
    const vs = visiveis();
    const atras = items.filter((it) => it.radar && !concl(it) && dias(prazo(it)) < 0).length;
    $('#meta').textContent = vs.length + (vs.length === 1 ? ' atividade' : ' atividades') + (atras ? ' · ' + atras + ' atrasada(s) no radar' : '') + ' · toque para editar';
    if (!vs.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nada aqui.'; list.appendChild(e); return; }
    vs.forEach((it) => {
      const d = prazo(it), n = dias(d);
      const c = document.createElement('div');
      c.className = 'card' + (concl(it) ? ' done' : n != null && n < 0 ? ' late' : n != null && n <= 2 ? ' soon' : '') + (it.radar ? '' : ' off');
      const top = document.createElement('div'); top.className = 'top';
      const id = document.createElement('span'); id.className = 'id'; id.textContent = it.id;
      const tt = document.createElement('span'); tt.className = 'tit'; tt.textContent = it.atividade;
      top.append(id, tt);
      const info = document.createElement('div'); info.className = 'info';
      const pz = document.createElement('b'); pz.textContent = d ? p2(d.getDate()) + '/' + p2(d.getMonth() + 1) : (it.dia || 'sem prazo');
      info.append(pz, document.createTextNode(' · ' + (it.status || '—') + ' · ' + (it.prioridade || '—')));
      const tags = document.createElement('div'); tags.className = 'tags';
      const tag = (txt, cls) => { const s = document.createElement('span'); s.className = 'tag ' + cls; s.textContent = txt; tags.appendChild(s); };
      if (!concl(it) && n != null && n < 0) tag('atrasado ' + (-n) + 'd', 'late');
      else if (!concl(it) && n != null && n <= 2) tag(n === 0 ? 'vence hoje' : 'vence em ' + n + 'd', 'soon');
      if (it.revisar) tag('revisar', 'rev');
      const acts = document.createElement('div'); acts.className = 'acts';
      const btn = (txt, on, fn) => { const b = document.createElement('button'); b.textContent = txt; if (on) b.className = 'on'; b.addEventListener('click', (ev) => { ev.stopPropagation(); fn(); }); acts.appendChild(b); };
      if (!concl(it)) btn('✓ Concluir', false, () => salvar(it, { status: 'Concluído' }, 'concluído'));
      btn(it.radar ? 'No radar' : 'Fora do radar', it.radar, () => salvar(it, { radar: !it.radar }));
      btn('Revisar', it.revisar, () => salvar(it, { revisar: !it.revisar }));
      c.append(top, info);
      if (tags.childNodes.length) c.appendChild(tags);
      c.appendChild(acts);
      c.addEventListener('click', () => openEdit(it));
      list.appendChild(c);
    });
  }

  async function carregar() {
    $('#meta').textContent = 'Carregando…';
    try {
      const j = await api('GET');
      items = j.items;
      const fr = $('#frentes'); fr.replaceChildren();
      [...new Set(items.map((i) => i.frente).filter(Boolean))].sort().forEach((f) => { const o = document.createElement('option'); o.value = f; fr.appendChild(o); });
      render();
    } catch (e) { $('#meta').textContent = e.message; toast(e.message, true); }
  }

  async function salvar(it, fields, nota) {
    try {
      const j = await api('POST', { action: 'update', id: it.id, fields, nota: nota || '' });
      const i = items.findIndex((x) => x.id === it.id); if (i >= 0) items[i] = j.item;
      render(); toast('Salvo na planilha');
    } catch (e) { toast(e.message, true); }
  }

  function openEdit(it) {
    editing = it;
    $('#eTit').textContent = it ? 'Editar ' + it.id : 'Nova atividade';
    $('#fAtiv').value = it ? it.atividade : '';
    $('#fFrente').value = it ? it.frente : '';
    $('#fPrio').value = it && ['Alta', 'Média', 'Baixa', 'Rotina'].includes(it.prioridade) ? it.prioridade : (it && /^alta/i.test(it.prioridade) ? 'Alta' : 'Média');
    const d = it ? prazo(it) : null;
    $('#fData').value = d ? d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) : '';
    $('#fDia').value = it ? it.dia : '';
    const st = $('#fStatus');
    st.querySelectorAll('option[data-extra]').forEach((o) => o.remove());
    if (it && it.status && ![...st.options].some((o) => o.value === it.status)) { const o = document.createElement('option'); o.dataset.extra = '1'; o.textContent = it.status; st.prepend(o); }
    st.value = it ? (it.status || 'Pendente') : 'Pendente';
    $('#fProx').value = it ? it.proximo : '';
    $('#fNota').value = '';
    $('#fRadar').checked = it ? it.radar : true;
    $('#fRev').checked = it ? it.revisar : false;
    $('#fHist').textContent = it && it.atualizacoes ? it.atualizacoes.split(' | ').join('\n') : '';
    $('#sEdit').hidden = false;
  }

  $('#fData').addEventListener('change', () => {
    const v = $('#fData').value; if (!v) return;
    const [, m, d] = v.split('-'); $('#fDia').value = d + '/' + m;
  });

  $('#eSave').addEventListener('click', async () => {
    const fields = {
      atividade: $('#fAtiv').value.trim(), frente: $('#fFrente').value.trim(), prioridade: $('#fPrio').value,
      dia: $('#fDia').value.trim(), status: $('#fStatus').value, proximo: $('#fProx').value.trim(),
      radar: $('#fRadar').checked, revisar: $('#fRev').checked,
    };
    if (!fields.atividade) { toast('Descreva a atividade', true); return; }
    $('#eSave').disabled = true;
    try {
      if (editing) {
        const j = await api('POST', { action: 'update', id: editing.id, fields, nota: $('#fNota').value });
        const i = items.findIndex((x) => x.id === editing.id); if (i >= 0) items[i] = j.item;
      } else {
        const j = await api('POST', { action: 'add', fields });
        items.push(j.item);
      }
      $('#sEdit').hidden = true; render(); toast('Salvo na planilha');
    } catch (e) { toast(e.message, true); }
    $('#eSave').disabled = false;
  });
  $('#eCancel').addEventListener('click', () => ($('#sEdit').hidden = true));

  function openCfg() { $('#cUrl').value = store.get('url'); $('#cTok').value = store.get('token'); $('#sCfg').hidden = false; }
  $('#bCfg').addEventListener('click', openCfg);
  $('#cCancel').addEventListener('click', () => ($('#sCfg').hidden = true));
  $('#cSave').addEventListener('click', () => {
    const u = $('#cUrl').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)) { toast('A URL deve terminar em /exec', true); return; }
    store.set('url', u); store.set('token', $('#cTok').value);
    $('#sCfg').hidden = true; carregar();
  });

  $('#bNew').addEventListener('click', () => openEdit(null));
  $('#bReload').addEventListener('click', carregar);
  $('#q').addEventListener('input', render);
  $('#chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    filtro = b.dataset.f;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
    render();
  });
  document.querySelectorAll('.sheet').forEach((s) => s.addEventListener('click', (e) => { if (e.target === s) s.hidden = true; }));

  if (store.get('url') && store.get('token')) carregar(); else { $('#meta').textContent = 'Toque em ⚙ para conectar à planilha.'; openCfg(); }
})();
</script>
</body>
</html>
